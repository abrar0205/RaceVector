name: Deploy RaceVector visual lab
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild the public race calendar each day (UTC); source updates nightly.
    - cron: "17 3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real historical and future race calendar (metadata only)
        run: python -m pipeline.catalog --out web/data/catalog.json
      - name: Prevent accidental publication of raw telemetry
        run: |
          if find web/data -type f ! -name catalog.json -print -quit | grep -q .; then
            echo 'Refusing to publish recorded telemetry without rights review' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment