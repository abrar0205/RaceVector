name: Validate RaceVector
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check web/app.js
          node --check web/model.js
          node --check web/track3d.js
          node --check web/circuits.js
          python - <<'PYTEST'
          from html.parser import HTMLParser
          from pathlib import Path
          text=Path('web/index.html').read_text()
          required=('select-driver-a','select-lap-a','select-driver-b','select-lap-b','chart-predicted','activation-nodes','track-3d-stage','view-mode','model-prediction','model-observed')
          for element_id in required:
              assert f'id="{element_id}"' in text, element_id
          PYTEST
      - name: Verify ONNX model predictions and 32 real hidden channels
        shell: bash
        run: |
          if test -f web/models/racevector.onnx; then
            pip install 'onnxruntime>=1.20,<2'
            python - <<'PYMODEL'
          import json
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          model=Path('web/models/racevector.onnx')
          report=json.loads(Path('web/models/evaluation.json').read_text())
          assert report['source']=='OpenF1 historical API'
          session=ort.InferenceSession(str(model),providers=['CPUExecutionProvider'])
          inputs={session.get_inputs()[0].name:np.zeros((2,12,5),dtype=np.float32)}
          preds,acts=session.run(None,inputs)
          assert preds.shape==(2,) and acts.shape==(2,32), (preds.shape,acts.shape)
          assert np.isfinite(preds).all() and np.isfinite(acts).all()
          print('Verified ONNX prediction and real 32-channel hidden-state output shapes')
          PYMODEL
          fi
      - name: Confirm no model success is claimed without evaluation
        shell: bash
        run: |
          if test -f web/models/racevector.onnx && ! test -f web/models/evaluation.json; then
            echo 'Model is not accompanied by evaluation report' >&2
            exit 1
          fi
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify circuit matching units
        run: node --test tests/circuits.test.cjs
      - name: Vendor exact Three.js runtime and inference assets
        run: |
          npm install --prefix /tmp/racevector-vendor --no-package-lock --ignore-scripts --no-audit --no-fund onnxruntime-web@1.22.0 three@0.174.0
          mkdir -p web/vendor/ort web/vendor/three
          cp /tmp/racevector-vendor/node_modules/onnxruntime-web/dist/ort.min.js web/vendor/ort/
          cp /tmp/racevector-vendor/node_modules/onnxruntime-web/dist/ort-wasm*.wasm web/vendor/ort/
          cp /tmp/racevector-vendor/node_modules/onnxruntime-web/dist/ort-wasm*.mjs web/vendor/ort/
          cp /tmp/racevector-vendor/node_modules/three/build/three.module.js web/vendor/three/
          cp /tmp/racevector-vendor/node_modules/three/build/three.core.js web/vendor/three/
      - name: Install browser QA runner
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser regression tests (desktop/mobile, 429, circuit 3D)
        run: node tests/browser.cjs