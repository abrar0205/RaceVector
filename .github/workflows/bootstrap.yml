name: Import RaceVector initial source
on:
  push:
    branches: [main]
    paths:
      - "bootstrap/part*.b64"
permissions:
  contents: write
concurrency:
  group: racevector-source-import
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all archive parts are present
        id: parts
        run: |
          for i in 00 01 02 03 04 05; do
            if [ ! -s "bootstrap/part$i.b64" ]; then
              echo "complete=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Extract source archive and commit
        if: steps.parts.outputs.complete == 'true'
        run: |
          set -euo pipefail
          cat bootstrap/part*.b64 | base64 --decode | xz --decompress | tar --extract --directory .
          rm -rf bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import RaceVector source, motorsport UI and real-data ML pipeline"
          git push origin HEAD:main
